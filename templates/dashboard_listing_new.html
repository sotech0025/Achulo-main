{% extends "base.html" %}
{% block title %}New Listing — {{ app_name }}{% endblock %}
{% block content %}
<div class="container mx-auto px-4 md:px-8 max-w-2xl py-10">
  <h1 class="text-3xl font-serif font-bold mb-8">Create Listing</h1>

  <form method="post" class="space-y-5 bg-card border border-border rounded-2xl p-6">
    <div>
      <label class="text-sm font-medium block mb-1">Title</label>
      <input type="text" name="title" placeholder="2-Bedroom Flat, Lekki Phase 1" required
             class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
    </div>
    <div>
      <label class="text-sm font-medium block mb-1">Description</label>
      <textarea name="description" rows="4" placeholder="Describe the property..."
                class="w-full px-3 py-2 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium block mb-1">State</label>
        <input type="text" name="state" placeholder="Lagos"
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">LGA / Area</label>
        <input type="text" name="lga" placeholder="Eti-Osa"
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
    </div>
    <div>
      <label class="text-sm font-medium block mb-1">Address</label>
      <input type="text" name="address" placeholder="Street address"
             class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium block mb-1">Price (₦)</label>
        <input type="number" name="price" min="1" placeholder="1800000" required
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Rental period</label>
        <select name="rental_period" class="w-full h-11 px-3 rounded-md border border-border">
          <option value="per_annum">Per year</option>
          <option value="per_month">Per month</option>
        </select>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium block mb-1">Bedrooms</label>
        <input type="number" name="bedrooms" min="0" value="1"
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Bathrooms</label>
        <input type="number" name="bathrooms" min="0" value="1"
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
    </div>
    <div>
      <label class="text-sm font-medium block mb-1">Image URL (optional)</label>
      <input type="url" name="image_url" placeholder="https://..."
             class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
    </div>

    <button type="submit" class="w-full h-11 rounded-lg bg-primary text-primary-foreground font-medium hover:opacity-90 transition">
      Publish Listing
    </button>
  </form>
</div>
{% endblock %}

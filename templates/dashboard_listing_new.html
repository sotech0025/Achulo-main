{% extends "base.html" %}
{% block title %}{{ 'Edit Listing' if listing else 'New Listing' }} — {{ app_name }}{% endblock %}
{% block content %}
<div class="container mx-auto px-4 md:px-8 max-w-2xl py-10">
  <h1 class="text-3xl font-serif font-bold mb-8">{{ 'Edit Listing' if listing else 'Create Listing' }}</h1>

  <form method="post" class="space-y-5 bg-card border border-border rounded-2xl p-6">
    <div>
      <label class="text-sm font-medium block mb-1">Title *</label>
      <input type="text" name="title" placeholder="2-Bedroom Flat, Lekki Phase 1" required value="{{ listing['title'] if listing else '' }}"
             class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
    </div>
    <div>
      <label class="text-sm font-medium block mb-1">Location Tag *</label>
      <input type="text" name="location_tag" placeholder="e.g., Lekki, Lagos" required value="{{ listing['location_tag'] if listing else '' }}"
             class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
    </div>
    <div>
      <label class="text-sm font-medium block mb-1">Description *</label>
      <textarea name="description" rows="4" placeholder="Describe the property..." required
                class="w-full px-3 py-2 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary">{{ listing['description'] if listing else '' }}</textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium block mb-1">State *</label>
        <input type="text" name="state" placeholder="Lagos" required value="{{ listing['state'] if listing else '' }}"
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">LGA *</label>
        <input type="text" name="lga" placeholder="Eti-Osa" required value="{{ listing['lga'] if listing else '' }}"
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
    </div>
    <div>
      <label class="text-sm font-medium block mb-1">Address *</label>
      <input type="text" name="address" placeholder="Street address" required value="{{ listing['address'] if listing else '' }}"
             class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium block mb-1">Price (₦) *</label>
        <input type="number" name="price" min="1" placeholder="1800000" required value="{{ listing['price'] if listing else '' }}"
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Rental Period *</label>
        <select name="rental_period" required class="w-full h-11 px-3 rounded-md border border-border">
          <option value="per_annum" {{ 'selected' if listing and listing['rental_period']=='per_annum' }}>Per year</option>
          <option value="per_month" {{ 'selected' if listing and listing['rental_period']=='per_month' }}>Per month</option>
        </select>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium block mb-1">Bedrooms *</label>
        <input type="number" name="bedrooms" min="0" value="{{ listing['bedrooms'] if listing else 1 }}" required
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Bathrooms *</label>
        <input type="number" name="bathrooms" min="0" value="{{ listing['bathrooms'] if listing else 1 }}" required
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
    </div>
    <div class="flex gap-3 pt-4 border-t border-border">
      <button type="submit" class="flex-1 h-11 rounded-lg bg-primary text-primary-foreground font-medium hover:opacity-90 transition">
        {{ 'Save Changes' if listing else 'Create Listing' }}
      </button>
      <a href="{{ url_for('dashboard_listings') }}" class="flex-1 h-11 rounded-lg border border-border font-medium hover:bg-muted/30 transition flex items-center justify-center">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% import "_icons.html" as icons %}
{% block title %}Log in — {{ app_name }}{% endblock %}
{% block content %}
<div class="relative flex-1 flex items-center justify-center py-16 px-4 overflow-hidden isolate">

  <!-- Animated background — shared with the register page, no grid pattern -->
  <div class="auth-bg">
    <div class="auth-blob auth-blob-1"></div>
    <div class="auth-blob auth-blob-2"></div>
  </div>

  <div class="relative w-full max-w-md bg-card/95 backdrop-blur-sm border border-border rounded-2xl shadow-2xl p-8">
    <h1 class="text-2xl font-serif font-bold mb-2">Welcome Back</h1>
    <p class="text-muted-foreground text-sm mb-6">Log in to manage your listings and bookings.</p>

    <form method="post" class="space-y-4">
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input type="email" name="email" placeholder="you@example.com" required
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Password</label>
        <div class="relative">
          <input type="password" name="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required
                 class="w-full h-11 px-3 pr-11 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
          <button type="button" id="login-password-toggle" aria-label="Show password"
                  class="absolute inset-y-0 right-0 flex items-center px-3 text-muted-foreground hover:text-foreground transition-colors">
            {{ icons.eye('h-5 w-5 password-eye-show') }}
            {{ icons.eye_off('h-5 w-5 password-eye-hide hidden') }}
          </button>
        </div>
      </div>
      <button type="submit" class="w-full h-11 rounded-lg bg-primary text-primary-foreground font-medium hover:opacity-90 transition">Log in</button>
    </form>

    <p class="text-sm text-muted-foreground mt-6 text-center">
      Don't have an account? <a href="{{ url_for('register') }}" class="text-primary font-medium hover:underline">Sign up</a>
    </p>
  </div>
</div>

<script>
  document.getElementById('login-password-toggle').addEventListener('click', function () {
    const input = document.getElementById('login-password');
    const showIcon = this.querySelector('.password-eye-show');
    const hideIcon = this.querySelector('.password-eye-hide');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    showIcon.classList.toggle('hidden', isHidden);
    hideIcon.classList.toggle('hidden', !isHidden);
    this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
  });
</script>
{% endblock %}

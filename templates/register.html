{% extends "base.html" %}
{% block title %}Create Account — {{ app_name }}{% endblock %}
{% block content %}
<div class="flex-1 flex items-center justify-center py-16 px-4">
  <div class="w-full max-w-md bg-card border border-border rounded-2xl shadow-sm p-8">
    <h1 class="text-2xl font-serif font-bold mb-2">Create Account</h1>
    <p class="text-muted-foreground text-sm mb-6">Join ACHOULO to list properties or find your next home.</p>

    <form method="post" class="space-y-4">
      <div>
        <label class="text-sm font-medium block mb-1">Full name</label>
        <input type="text" name="name" placeholder="John Doe" required
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input type="email" name="email" placeholder="you@example.com" required
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Phone</label>
        <input type="tel" name="phone" placeholder="+234..."
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Country</label>
        <input type="text" name="country" placeholder="Nigeria"
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Password</label>
        <input type="password" name="password" placeholder="••••••••" autocomplete="new-password" required
               class="w-full h-11 px-3 rounded-md border border-border focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>
      <button type="submit" class="w-full h-11 rounded-lg bg-primary text-primary-foreground font-medium hover:opacity-90 transition">Create account</button>
    </form>

    <p class="text-sm text-muted-foreground mt-6 text-center">
      Already have an account? <a href="{{ url_for('login') }}" class="text-primary font-medium hover:underline">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
